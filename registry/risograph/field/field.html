<!--
  Risograph — Field (plain-HTML snippet, universal fallback).
  A <label> wrapping a single control (Input/Textarea/Select). Include
  ./tokens.css + ./field.css once. Attribute contract:
    data-error : "true" when in the error state (swaps help → error treatment)
    data-shape : square | pill  (pill rounds the wrapped control; default square)
  Structure: optional __label (with __req mark) → the control → __msg (help/error).
-->
<label class="riso-field" data-shape="square" data-error="false">
  <span class="riso-field__label">Email<span class="riso-field__req"> *</span></span>
  <input class="riso-input" placeholder="you@example.com" />
  <span class="riso-field__msg">We'll never share it.</span>
</label>

<!-- Error state -->
<label class="riso-field" data-error="true">
  <span class="riso-field__label">Email</span>
  <!-- control -->
  <span class="riso-field__msg riso-field__msg--error">Enter a valid email.</span>
</label>
