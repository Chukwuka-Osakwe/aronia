    data-variant      : paper | primary | secondary | muted   (default paper)
    data-footer-align : end | center | start | between   (footer only; default end)
  Header and footer are optional; omit those divs if unused.
-->
<div class="nb-card" data-variant="paper">

  <div class="nb-card__footer" data-footer-align="end">Footer</div>
</div>
