<!--
  Neo-Brutalism — Modal (plain-HTML snippet, universal fallback).
  Include ./tokens.css + ./modal.css once. Built on native <dialog>: call
  dialog.showModal() to open (top-layer, focus trap, Esc, ::backdrop for free) and
  dialog.close() to close. data-has-header="true" when a header is present.
-->
<dialog class="nb-modal" data-has-header="true" aria-labelledby="m-title">
  <button type="button" class="nb-modal__close" aria-label="Close">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true">
      <line x1="6" y1="6" x2="18" y2="18" /><line x1="18" y1="6" x2="6" y2="18" />
    </svg>
  </button>
  <div class="nb-modal__header" id="m-title">Modal title</div>
  <div class="nb-modal__body">The modal body content goes here.</div>
  <div class="nb-modal__footer">Actions</div>
</dialog>
