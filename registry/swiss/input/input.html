<!--
  Swiss — Input (plain-HTML snippet, universal fallback).
  Include ./tokens.css + ./input.css once. Attribute contract:
    data-size  : sm | md | lg    (default md)
    data-shape : square | pill   (default square)
  It's a plain <input> — all native attributes (value, placeholder, disabled, …) apply.
-->
<input class="swiss-input" data-size="md" placeholder="you@example.com" />
<input class="swiss-input" data-size="lg" value="Larger field" />
<input class="swiss-input" data-shape="pill" placeholder="Rounded pill" />
<input class="swiss-input" data-size="md" value="Disabled" disabled />
