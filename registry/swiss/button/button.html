<!--
  Swiss — Button (plain-HTML snippet, the universal fallback)

  The design language is just a class + data-attributes, so an agent can
  translate this into ANY framework (Vue, Solid, Angular, Svelte, htmx, vanilla)
  by mapping props onto these attributes. Include the two stylesheets once:

    <link rel="stylesheet" href="./tokens.css" />   <!-- Layer 1: tokens -->
    <link rel="stylesheet" href="./button.css" />   <!-- Layer 2: the style -->

  Attribute contract:
    data-variant : primary | secondary | muted | ghost | quiet   (default primary)
    data-size    : xs | sm | md | lg                              (default md)
    data-shape   : square | pill                                  (default square)
    disabled     : present → inert; render as <button>. For a link, use <a href>.
-->

<!-- Default: primary button (the one hazard-orange accent) -->
<button class="swiss-btn" data-variant="primary" data-size="md" data-shape="square">
  <span class="swiss-btn__label">Click me</span>
</button>

<!-- Secondary: strong ink neutral -->
<button class="swiss-btn" data-variant="secondary" data-size="md" data-shape="square">
  <span class="swiss-btn__icon"><!-- svg / icon here --></span>
  <span class="swiss-btn__label">Save</span>
</button>

<!-- Ghost: an outline button (transparent, hairline border) -->
<button class="swiss-btn" data-variant="ghost" data-size="md" data-shape="square">
  <span class="swiss-btn__label">Cancel</span>
</button>

<!-- Link variant: an <a> with href renders as a button-styled link -->
<a class="swiss-btn" data-variant="primary" data-size="md" data-shape="square" href="/somewhere">
  <span class="swiss-btn__label">Go</span>
</a>

<!-- Disabled -->
<button class="swiss-btn" data-variant="primary" data-size="md" data-shape="square" disabled>
  <span class="swiss-btn__label">Unavailable</span>
</button>
