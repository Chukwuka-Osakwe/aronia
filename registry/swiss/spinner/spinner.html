<!--
  Swiss — Spinner (plain-HTML snippet, universal fallback).
  Include ./tokens.css + ./spinner.css once. Attribute contract:
    data-size  : sm | md | lg                 (default md)
    data-speed : slow | normal | fast         (default normal)
  Set aria-label to your loading message.
-->
<span class="swiss-spinner" data-size="md" data-speed="normal" role="status" aria-label="Loading">
  <span class="swiss-spinner__box" aria-hidden="true"></span>
</span>
