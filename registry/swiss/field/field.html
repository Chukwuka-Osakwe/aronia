<!--
  Swiss — Field (plain-HTML snippet, universal fallback).
  A <label> wrapping a single control (Input/Textarea/Select). Include
  ./tokens.css + ./field.css once. Attribute contract:
    data-shape : square | pill  (pill rounds the wrapped control; default square)
    data-size  : sm | md | lg   (sizes the pill label/help inset; default md)
  Plain HTML has no context, so wire the control by hand:
    - help state:  aria-describedby on the control → the __msg `id`
    - error state: aria-invalid="true" on the control (drives the danger border),
      aria-describedby → the error __msg `id`, and role="alert" on that message.
  Structure: optional __label (with __req mark) → the control → __msg (help/error).
-->
<label class="swiss-field" data-shape="square" data-size="md">
  <span class="swiss-field__label">Email<span class="swiss-field__req"> *</span></span>
  <input class="swiss-input" data-size="md" placeholder="you@example.com" aria-describedby="email-help" />
  <span class="swiss-field__msg" id="email-help">We'll never share it.</span>
</label>

<!-- Error state — aria-invalid flags the control, role="alert" announces the message -->
<label class="swiss-field" data-shape="square" data-size="md">
  <span class="swiss-field__label">Email</span>
  <input class="swiss-input" data-size="md" value="not-an-email" aria-invalid="true" aria-describedby="email-error" />
  <span class="swiss-field__msg swiss-field__msg--error" id="email-error" role="alert">Enter a valid email.</span>
</label>
