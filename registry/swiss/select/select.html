<!--
  Swiss — Select (plain-HTML snippet, universal fallback).
  Include ./tokens.css + ./select.css once. Structure: a wrapper holding the native
  <select> (styled, native arrow stripped) plus an overlaid chevron. Contract:
    data-size     : sm | md | lg on .swiss-select__field   (default md)
    data-disabled : "true" on the wrapper when disabled
    aria-invalid  : "true" on .swiss-select__field flags an error (danger border; also set by Field)
-->
<div class="swiss-select" data-disabled="false">
  <select class="swiss-select__field" data-size="md">
    <option value="" disabled selected>Choose a plan</option>
    <option value="Free">Free</option>
    <option value="Pro">Pro</option>
    <option value="Team">Team</option>
  </select>
  <svg class="swiss-select__chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <polyline points="6 9 12 15 18 9" />
  </svg>
</div>
