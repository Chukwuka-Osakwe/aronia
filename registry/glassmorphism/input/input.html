<!--
  Glassmorphism — Input (plain-HTML snippet, universal fallback).
  Include ./tokens.css + ./input.css once. Attribute contract:
    data-size : sm | md | lg   (default md)
  It's a plain <input> — all native attributes (value, placeholder, disabled, …) apply.
-->
<input class="glass-input" data-size="md" placeholder="you@example.com" />
<input class="glass-input" data-size="lg" value="Larger field" />
<input class="glass-input" data-size="md" value="Disabled" disabled />
