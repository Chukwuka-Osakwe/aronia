<!--
  Glassmorphism — Card (plain-HTML snippet, universal fallback).
  Include ./tokens.css + ./card.css once. Attribute contract:
    data-variant      : surface | strong | primary | secondary   (default surface)
    data-footer-align : end | center | start | between   (footer only; default end)
  Header and footer are optional; omit those divs if unused.
-->
<div class="glass-card" data-variant="surface">
  <div class="glass-card__header">Card title</div>
  <div class="glass-card__body">The body content of the card goes here.</div>
  <div class="glass-card__footer" data-footer-align="end">Footer</div>
</div>
